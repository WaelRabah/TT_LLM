[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tt_llm"
version = "0.1.0"
description = "Tensor-Train (TT) compression for transformer linear layers"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.0"]
models = ["transformers>=4.40", "accelerate>=0.20", "huggingface_hub>=0.20"]

[tool.setuptools]
packages = ["tt_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
